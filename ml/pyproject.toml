[project]
name = "oplab"
version = "0.1.0"
description = "Offline ML lab for One Piece Card Battle AR: card data, reference embeddings, evaluation, Core ML export"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "requests>=2.32",
]

[project.optional-dependencies]
# Fine-tuned embedding model (only needed once Vision feature prints plateau).
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    "coremltools>=8.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
