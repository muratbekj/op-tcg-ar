[project]
name = "onepiece-ar-ml"
version = "0.1.0"
description = "Offline lab: card data, reference embeddings, recognition evaluation, Core ML export"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "requests>=2.32",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10",
    "torch>=2.4",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.5",
]
export = [
    "coremltools>=8.0",
]

[tool.uv]
package = false
